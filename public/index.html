<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiZ Local Controller</title><style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151922;--panel2:#1c2230;--line:#2a3243;--text:#eef2f8;--dim:#8e99ad;--accent:#ffc857;--ok:#7fd99a;--bad:#ff8a8a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#2a2140 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#13283a 0,transparent 60%),var(--bg)}
.shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:conic-gradient(from 200deg,#ffc857,#ff7a59,#c86bff,#5ac8ff,#ffc857);box-shadow:0 0 30px #ffc85755}
h1{margin:0;font-size:1.35rem;letter-spacing:-.02em}.sub{margin:2px 0 0;color:var(--dim);font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ok);background:#7fd99a14;border:1px solid #7fd99a33;padding:5px 10px;border-radius:99px}.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;font-weight:650;cursor:pointer;background:var(--accent);color:#1d1606;transition:transform .12s,filter .2s,background .2s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}button:disabled{opacity:.5;cursor:wait}
.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.icon{padding:7px 10px;font-size:.8rem}.danger:hover{background:#4a1f27;color:#ffd5da}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 18px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:14px}.tab{background:none;color:var(--dim);padding:8px 16px}.tab.on{background:var(--panel2);color:var(--text);box-shadow:0 2px 10px #0006}
.count{font-size:.72rem;background:var(--accent);color:#1d1606;border-radius:99px;padding:1px 7px;margin-left:6px}
.group{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:.88rem;transition:transform .3s;box-shadow:0 10px 40px #000a;max-width:90vw}.toast.show{transform:translateX(-50%)}.toast.error{border-color:#ff8a8a66;color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.card{position:relative;overflow:hidden;border-radius:24px;background:var(--panel);border:1px solid var(--line);padding:20px;transition:border-color .3s,box-shadow .4s}
.card::before{content:"";position:absolute;inset:-40% -20% auto;height:80%;background:radial-gradient(closest-side,var(--glow,transparent),transparent);opacity:var(--gi,0);transition:opacity .5s,background .5s;pointer-events:none}
.card.on{border-color:color-mix(in srgb,var(--glow) 40%,var(--line));box-shadow:0 20px 60px -20px var(--glow)}
.top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.top h2{margin:0;font-size:1.1rem}.meta{font:11px ui-monospace,monospace;color:var(--dim);margin-top:4px}.acts{display:flex;gap:6px}
.hero{position:relative;display:flex;align-items:center;justify-content:center;gap:22px;margin:16px 0 8px}
.bulb{width:120px;height:120px;border-radius:50%;cursor:pointer;border:0;padding:0;background:radial-gradient(circle at 50% 42%,var(--lc,#333) 0,color-mix(in srgb,var(--lc,#333) 60%,#000) 55%,#0d0f14 100%);box-shadow:0 0 calc(var(--lb,0)*80px) calc(var(--lb,0)*12px) var(--lc,transparent),inset 0 -10px 30px #0008;transition:all .45s}
.bulb.off{--lc:#272c38!important;box-shadow:inset 0 -10px 30px #0008}.bulb svg{width:48px;height:48px;opacity:.85}
.stat{text-align:left}.big{font-size:2.2rem;font-weight:750;letter-spacing:-.03em}.small{color:var(--dim);font-size:.8rem}
.ctl{position:relative;margin:16px 0}.ctl .lbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);margin-bottom:8px}.ctl .lbl b{color:var(--text);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;outline:none;cursor:pointer;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--panel);box-shadow:0 2px 10px #000a}input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--panel)}
.dim{--track:linear-gradient(90deg,#222 0,var(--lc,#ffc857) 100%)}.temp{--track:linear-gradient(90deg,#ff9a3c,#ffd8a8 45%,#f4f6ff 70%,#bcd4ff)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid #fff2;background:var(--c)}.sw.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.scene{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-size:.78rem;padding:8px 6px;font-weight:600}.scene span{display:block;font-size:1.1rem;margin-bottom:2px}
.offline{position:relative;color:var(--bad);font-size:.8rem;margin-top:10px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:24px;color:var(--dim)}.empty .bulb{margin:0 auto 18px;cursor:default}
.disc{display:grid;grid-template-columns:320px 1fr;gap:18px}@media(max-width:820px){.disc{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px}.box h2{margin:0 0 4px;font-size:1.05rem}.box p{color:var(--dim);font-size:.85rem;margin:0 0 16px}
.field{display:flex;gap:8px;margin-bottom:12px}.field input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.radar{position:relative;width:200px;height:200px;margin:8px auto 18px;border-radius:50%;background:radial-gradient(circle,#ffc85710 0,transparent 70%),repeating-radial-gradient(circle,transparent 0 31px,#ffffff10 32px 33px);border:1px solid var(--line)}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ffc85766,transparent 25%);opacity:0;transition:opacity .3s}.radar.go .sweep{opacity:1;animation:spin 1.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.radar .dot{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:pop .5s ease-out}@keyframes pop{from{transform:scale(0)}}
.radar .center{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff}
.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);animation:slide .4s ease-out}@keyframes slide{from{opacity:0;transform:translateY(8px)}}
.mini{width:40px;height:40px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffe2a0,#a86d10);box-shadow:0 0 18px #ffc85755}.item .grow{flex:1;min-width:0}.item b{display:block}
.badge{font-size:.78rem;color:var(--ok);font-weight:700;white-space:nowrap}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;padding:22px;width:min(380px,90vw)}dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}dialog h3{margin:0 0 6px}dialog p{color:var(--dim);font-size:.85rem;margin:0 0 14px}dialog input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:14px}.row{display:flex;justify-content:flex-end;gap:8px}
.hidden{display:none!important}
</style></head><body><div class="shell">
<header><div class="brand"><div class="logo"></div><div><h1>WiZ Local Controller</h1><p class="sub">Your lamps, controlled only from this PC</p></div></div><span class="pill"><i></i>Offline-only · LAN UDP</span></header>
<div class="bar"><nav class="tabs"><button class="tab on" data-tab="dash">Dashboard<span class="count" id="nDash">0</span></button><button class="tab" data-tab="disc">Discover</button></nav>
<div class="group" id="allCtl"><button class="ghost" id="allOn">All on</button><button class="ghost" id="allOff">All off</button></div></div>
<main class="grid" id="panel"></main>
<section id="discPanel" class="disc hidden">
<div class="box"><h2>Scan your network</h2><p>Sends WiZ probes on your private subnet only. Nothing leaves your LAN.</p>
<div class="radar" id="radar"><div class="sweep"></div><div class="center"></div></div>
<form class="field" id="discover"><input id="subnet" value="Ex: 192.168.1.0/24" aria-label="Private subnet"><button>Scan</button></form>
<form class="field" id="probe"><input id="ip" placeholder="Lamp IP, e.g. 192.168.1.120" aria-label="Lamp IP"><button class="ghost">Add by IP</button></form></div>
<div class="box"><h2>Lamps found</h2><p id="foundSub">Run a scan to see lamps on your network.</p><div class="list" id="found"></div></div>
</section></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dlgT"></h3><p id="dlgP"></p><input id="dlgI" maxlength="64"><div class="row"><button class="ghost" value="cancel">Cancel</button><button value="ok" id="dlgOk">Save</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),panel=$('#panel'),foundEl=$('#found'),toastEl=$('#toast');let devices=[],found=[],cards=new Map(),tt;
const api=async(u,o)=>{const r=await fetch(u,o),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Request failed.');return d},post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const say=(t,bad=false)=>{toastEl.textContent=t;toastEl.className=`toast show ${bad?'error':''}`;clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2800)};
const hex=(r,g,b)=>'#'+[r,g,b].map(x=>(+x).toString(16).padStart(2,'0')).join('');
function kelvin(k){const t=k/100;let r,g,b;if(t<=66){r=255;g=99.47*Math.log(t)-161.12;b=t<=19?0:138.52*Math.log(t-10)-305.04}else{r=329.7*Math.pow(t-60,-.1332);g=288.12*Math.pow(t-60,-.0755);b=255}const c=x=>Math.max(0,Math.min(255,Math.round(x)));return hex(c(r),c(g),c(b))}
function ask(title,text,value,ok='Save'){return new Promise(res=>{const d=$('#dlg');$('#dlgT').textContent=title;$('#dlgP').textContent=text;const i=$('#dlgI');i.classList.toggle('hidden',value===null);i.value=value??'';$('#dlgOk').textContent=ok;d.returnValue='';d.showModal();d.onclose=()=>res(d.returnValue==='ok'?(value===null?true:i.value.trim()):null)})}
const BULB='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
const COLORS=['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#007aff','#af52de','#ff2d92'];
const SCENES=[[6,'🛋️','Cozy'],[5,'🔥','Fireplace'],[1,'🌊','Ocean'],[4,'🎉','Party'],[3,'🌅','Sunset'],[14,'🌙','Night']];
function card(d){const e=document.createElement('section');e.className='card';e.innerHTML=`<div class="top"><div><h2></h2><div class="meta"></div></div><div class="acts"><button class="ghost icon ren" title="Rename">✎</button><button class="ghost icon danger rem" title="Remove">✕</button></div></div>
<div class="hero"><button class="bulb off" aria-label="Toggle light">${BULB}</button><div class="stat"><div class="big">—</div><div class="small st">Connecting…</div></div></div>
<div class="ctl"><div class="lbl">Brightness<b class="vd"></b></div><input class="dim" type="range" min="1" max="100"></div>
<div class="ctl"><div class="lbl">White temperature<b class="vt"></b></div><input class="temp" type="range" min="2200" max="6500" step="100"></div>
<div class="ctl"><div class="lbl">Colour</div><div class="swatches">${COLORS.map(c=>`<button class="sw" style="--c:${c}" data-c="${c}"></button>`).join('')}<label class="sw custom" title="Pick any colour"><input type="color"></label></div></div>
<div class="ctl"><div class="lbl">Scenes</div><div class="scenes">${SCENES.map(([id,i,n])=>`<button class="scene" data-s="${id}"><span>${i}</span>${n}</button>`).join('')}</div></div>
<div class="offline hidden"></div>`;
const q=s=>e.querySelector(s),bulb=q('.bulb'),dim=q('.dim'),temp=q('.temp'),big=q('.big'),st=q('.st'),off=q('.offline');q('h2').textContent=d.name;q('.meta').textContent=`${d.ip} · ${d.mac}`;let s={state:false,dimming:100,temp:2700};
const look=(color,bright,on)=>{e.style.setProperty('--lc',color);e.style.setProperty('--glow',color);e.style.setProperty('--gi',on?.25+bright/150:0);e.style.setProperty('--lb',on?.25+bright/130:0);bulb.style.setProperty('--lc',color);bulb.classList.toggle('off',!on);e.classList.toggle('on',on);big.textContent=on?`${bright}%`:'Off'};
const paint=x=>{s=x;dim.value=x.dimming??100;if(Number.isFinite(x.temp))temp.value=x.temp;q('.vd').textContent=`${dim.value}%`;q('.vt').textContent=`${temp.value} K`;const rgb=[x.r,x.g,x.b].every(Number.isFinite)&&(x.r+x.g+x.b>0)?hex(x.r,x.g,x.b):kelvin(+temp.value);const sc=SCENES.find(z=>z[0]===x.sceneId);st.textContent=x.state?(sc?`Scene · ${sc[2]}`:Number.isFinite(x.temp)?'White light':'Colour'):'Tap the bulb to turn on';look(rgb,+dim.value,!!x.state);off.classList.add('hidden')};
const refresh=async()=>{try{paint((await api(`/api/devices/${d.id}/state`)).result)}catch(x){off.textContent=`Not responding: ${x.message}`;off.classList.remove('hidden');st.textContent='Offline'}};
const send=async p=>{try{await post(`/api/devices/${d.id}/pilot`,p);await refresh()}catch(x){say(`${d.name}: ${x.message}`,true)}};
bulb.onclick=()=>{look(bulb.style.getPropertyValue('--lc')||'#ffc857',+dim.value,!s.state);send({state:!s.state})};
dim.oninput=()=>{q('.vd').textContent=`${dim.value}%`;look(bulb.style.getPropertyValue('--lc'),+dim.value,true)};dim.onchange=()=>send({state:true,dimming:+dim.value});
temp.oninput=()=>{q('.vt').textContent=`${temp.value} K`;look(kelvin(+temp.value),+dim.value,true)};temp.onchange=()=>send({state:true,temp:+temp.value,dimming:+dim.value});
const color=h=>{look(h,+dim.value,true);send({state:true,r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16),dimming:+dim.value})};
e.querySelectorAll('.sw[data-c]').forEach(b=>b.onclick=()=>color(b.dataset.c));const pick=q('.custom input');pick.oninput=()=>look(pick.value,+dim.value,true);pick.onchange=()=>color(pick.value);
e.querySelectorAll('.scene').forEach(b=>b.onclick=()=>send({state:true,sceneId:+b.dataset.s,dimming:+dim.value}));
q('.ren').onclick=async()=>{const n=await ask('Rename lamp','Names are stored only on this PC.',d.name);if(!n)return;try{d.name=(await post(`/api/devices/${d.id}/name`,{name:n})).device.name;q('h2').textContent=d.name;say('Renamed.')}catch(x){say(x.message,true)}};
q('.rem').onclick=async()=>{if(!await ask(`Remove ${d.name}?`,'It stays in Discover so you can add it back later.',null,'Remove'))return;try{await api(`/api/devices/${d.id}`,{method:'DELETE'});await load();await loadFound();say(`${d.name} removed.`)}catch(x){say(x.message,true)}};
e.api={on:v=>{look(bulb.style.getPropertyValue('--lc')||'#ffc857',+dim.value,v);return send({state:v})}};refresh();return e}
function render(){panel.innerHTML='';cards.clear();$('#nDash').textContent=devices.length;$('#allCtl').classList.toggle('hidden',!devices.length);if(!devices.length){panel.innerHTML=`<div class="empty"><div class="bulb off">${BULB}</div><h2>No lamps yet</h2><p>Find lamps on your network and add them here.</p><button id="goDisc">Discover lamps</button></div>`;$('#goDisc').onclick=()=>tab('disc');return}devices.forEach(d=>{const c=card(d);cards.set(d.id,c);panel.append(c)})}
async function load(){try{devices=(await api('/api/devices')).devices;render()}catch(e){say(e.message,true)}}
function dots(){const r=$('#radar');r.querySelectorAll('.dot').forEach(x=>x.remove());found.forEach(f=>{let h=0;for(const c of f.id)h=(h*31+c.charCodeAt(0))>>>0;const a=(h%360)*Math.PI/180,rad=30+(h>>9)%60,el=document.createElement('div');el.className='dot';el.style.left=`${50+Math.cos(a)*rad/2}%`;el.style.top=`${50+Math.sin(a)*rad/2}%`;el.title=f.name;r.append(el)})}
function renderFound(){foundEl.innerHTML='';dots();$('#foundSub').textContent=found.length?`${found.length} lamp${found.length>1?'s':''} answered.`:'Run a scan to see lamps on your network.';found.forEach(f=>{const e=document.createElement('div');e.className='item';e.innerHTML='<div class="mini"></div><div class="grow"><b></b><span class="meta"></span></div><span class="slot"></span>';e.querySelector('b').textContent=f.name;const ago=Math.max(0,Math.round((Date.now()-Date.parse(f.lastSeen))/60000));e.querySelector('.meta').textContent=`${f.ip} · ${f.model||'WiZ lamp'} · seen ${ago?ago+' min ago':'just now'}`;const slot=e.querySelector('.slot');
if(f.added&&f.ipChanged){const b=document.createElement('button');b.className='ghost';b.textContent='Address changed';b.title=`Was ${f.savedIp}`;b.onclick=async()=>{if(!await ask('Use new address?',`${f.name} was at ${f.savedIp} and now answers from ${f.ip}. Only confirm if you expected this.`,null,'Use new'))return;try{await post('/api/devices',{id:f.id});await load();await loadFound();say(`${f.name} now uses ${f.ip}.`)}catch(x){say(x.message,true)}};slot.append(b)}
else if(f.added){slot.innerHTML='<span class="badge">✓ On dashboard</span>'}
else{const b=document.createElement('button');b.textContent='Add';b.onclick=async()=>{const n=await ask('Add to dashboard','Give this lamp a name.',f.name,'Add');if(n===null)return;b.disabled=true;try{await post('/api/devices',{id:f.id,name:n});await load();await loadFound();say(`${n||f.name} added.`)}catch(x){b.disabled=false;say(x.message,true)}};slot.append(b)}foundEl.append(e)})}
async function loadFound(){try{found=(await api('/api/found')).found;renderFound()}catch{}}
$('#discover').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;$('#radar').classList.add('go');$('#foundSub').textContent='Scanning…';try{found=(await post('/api/discover',{subnet:$('#subnet').value})).found;renderFound();say(`Scan finished: ${found.length} lamp(s).`)}catch(x){say(x.message,true)}finally{b.disabled=false;$('#radar').classList.remove('go')}};
$('#probe').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{found=(await post('/api/probe',{ip:$('#ip').value})).found;renderFound();say('Lamp replied.')}catch(x){say(x.message,true)}finally{b.disabled=false}};
const all=v=>Promise.all([...cards.values()].map(c=>c.api.on(v)));$('#allOn').onclick=()=>all(true);$('#allOff').onclick=()=>all(false);
function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));const d=t==='disc';$('#discPanel').classList.toggle('hidden',!d);panel.classList.toggle('hidden',d);$('#allCtl').classList.toggle('hidden',d||!devices.length)}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>tab(t.dataset.tab));
load();loadFound();
</script></body></html>
